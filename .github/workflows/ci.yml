name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scenarios in sync (engine tests replay scenarios/, the app ships public/scenarios/)
        run: node scripts/sync-scenarios.mjs --check

      - name: Engine test suite (Phase A gate)
        run: pnpm test

      - name: Build web app
        run: pnpm --filter web run build

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Web e2e (Lab regime flip, cockpit license/retire, what-if isolation)
        run: pnpm --filter web run e2e

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1

      - name: LawMath test suite (Phase E, audit narrative only — never deployed)
        working-directory: contracts/law
        run: forge test -vv

      - name: forge fmt --check
        working-directory: contracts/law
        run: forge fmt --check
