name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scenarios in sync (engine tests replay scenarios/, the app ships public/scenarios/)
        run: node scripts/sync-scenarios.mjs --check

      - name: Engine test suite (Phase A gate)
        run: pnpm test

      # react-hooks/rules-of-hooks is the point of this step. It caught a real
      # conditional useMemo in the cockpit that every other gate -- types,
      # build, e2e -- passed straight over.
      - name: Lint web app
        run: pnpm --filter web run lint

      - name: Build web app
        run: pnpm --filter web run build

      # Weight, not timing. LCP/TTI swing with runner load and would either
      # be set so loose they catch nothing or fail at random; bytes on disk
      # do not. The 756KB hero image that shipped as the LCP element was
      # caught by a lint warning, not by anything that would have blocked it.
      - name: Performance budget
        run: pnpm perf

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Web e2e (Lab regime flip, cockpit license/retire, what-if isolation)
        run: pnpm --filter web run e2e

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1

      - name: LawMath test suite (Phase E, audit narrative only — never deployed)
        working-directory: contracts/law
        run: forge test -vv

      - name: forge fmt --check
        working-directory: contracts/law
        run: forge fmt --check
